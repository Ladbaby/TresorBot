# Copy to sun.yaml. Run Sun on the machine that keeps your bots and memory.
bind_addr: "127.0.0.1:11520"
db_path: "./sun.db"
memory_root: "./memory"
admin_password: "replace-with-your-owner-password"

integration_token: "replace-with-service-token"
gateway_control_token: "replace-with-control-token"
gateway_url: "http://127.0.0.1:11510"


# environments:
#   enabled: true
#   # Where installed environments live. Defaults to ~/.tresorbot/environments.
#   dir: "/var/lib/tresorbot/environments"
#   # Runs the environment host. Defaults to `node` on PATH.
#   node_path: "/usr/bin/node"
#   # Give webhook ingress its own listener, so the port an upstream posts to can
#   # be exposed without also exposing the owner dashboard on bind_addr.
#   ingress_addr: "127.0.0.1:11522"
#   # Queued events per bot before an upstream is told to retry.
#   max_pending_per_bot: 100

