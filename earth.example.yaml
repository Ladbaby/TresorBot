# Copy to earth.yaml on each machine where bots will run.
sun_url: "http://127.0.0.1:11520"
# Sun assigns this Earth ID and enrollment token. Keep the token private.
runner_id: "paste-the-Earth-ID-from-Sun"
runner_token: "paste-the-Earth-token-from-Sun"
db_path: "./earth.db"
state_dir: "./earth-state"

bind_addr: "127.0.0.1:11521"
# Defaults to ~/.tresorbot/workspace on this Earth
# default_workspace: "~/.tresorbot/workspace"
# Set true to run headless without Earth's local dashboard.
ui_disabled: false
admin_password: your-earth-admin-password

