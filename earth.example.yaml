# Copy to earth.yaml on each machine where bots will run.
sun_url: "http://127.0.0.1:11520"
runner_id: "paste-the-runner-ID-from-Sun"
runner_token: "paste-the-runner-token-from-Sun"
db_path: "./earth.db"
state_dir: "./earth-state"

node_path: "node"
# Full path to Pi 1.0.2's installed dist/cli.js file; use forward slashes on Windows.
pi_cli_path: "C:/path/to/pi-coding-agent/dist/cli.js"
# Omit pi_tools to use the default file and shell tools.
# pi_tools: [read, grep, find, ls, edit, write, powershell]

# For a remote Sun, use its HTTPS address instead of localhost.
