<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TresorBot</title><style>
:root{font:16px system-ui,sans-serif;color:#202a36;background:#f5f7fa}body{max-width:980px;margin:2rem auto;padding:0 1rem}header{display:flex;align-items:center;justify-content:space-between}nav{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}button,select,input,textarea{font:inherit;padding:.55rem .7rem;border:1px solid #cbd3df;border-radius:6px;background:white}button{cursor:pointer}button.active{background:#243b55;color:white}section{background:white;border:1px solid #dce2e9;border-radius:8px;padding:1rem;margin:1rem 0}label{display:block;margin:.7rem 0}label input:not([type=checkbox]),label textarea,label select{display:block;width:100%;margin-top:.3rem;box-sizing:border-box}textarea{min-height:8rem}small{color:#59697b}#status{min-height:1.5em;color:#43566b}li{margin:.35rem 0}
</style></head><body><header><h1>TresorBot owner</h1><button id="session" hidden></button></header><nav id="tabs"></nav><p id="status" role="status" aria-live="polite"></p><main id="main"></main><script>
(()=>{'use strict';const names=['Bots','Needs attention','Earth','Memory','Settings'],tabs=document.querySelector('#tabs'),main=document.querySelector('#main'),status=document.querySelector('#status'),session=document.querySelector('#session');let csrf='',authenticated=false,current='Bots';const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n},panel=t=>{main.replaceChildren(el('h2',t));return main},say=t=>status.textContent=t||'';
async function req(path,o={}){const method=o.method||'GET',headers={...(o.headers||{})};if(o.body!==undefined)headers['Content-Type']='application/json';if(method!=='GET'){headers['X-CSRF-Token']=csrf;headers.Origin=location.origin}const r=await fetch('/api'+path,{...o,headers,credentials:'same-origin'});let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}const send=(p,m,v)=>req(p,{method:m,body:JSON.stringify(v)});function btn(parent,label,fn){const b=el('button',label);b.onclick=async()=>{try{await fn()}catch(e){say(e.message)}};parent.append(b);return b}function field(parent,label,value='',tag='input'){const l=el('label',label),i=el(tag);i.value=value??'';l.append(i);parent.append(l);return i}
function render(){say('');tabs.replaceChildren();for(const n of names){const b=btn(tabs,n,()=>{current=n;render()});if(n===current)b.classList.add('active')}({Bots:bots,'Needs attention':attention,Earth:runners,Memory:memory,Settings:settings})[current]().catch(e=>say(e.message))}
async function bots(){const root=panel('Bots and contacts');const create=el('section'),newAlias=field(create,'New bot alias'),newName=field(create,'Display name');btn(create,'Create bot',async()=>{if(!newAlias.value.trim()||!newName.value.trim())throw Error('Enter an alias and display name.');await send('/bots','POST',{alias:newAlias.value.trim(),name:newName.value.trim(),adapter:'pi',enabled:true});render()});root.append(create);const allBots=await req('/bots'),earths=await req('/runners');root.append(el('p','Configure the exact same alias manually in Tresor; Sun does not create routes.'));for(const b of allBots){const c=el('section');c.append(el('h3',`${b.name||b.alias} · ${b.alias}`));if(b.id)c.append(el('small','Details: '+b.id));for(const [k,label,tag] of [['alias','Alias','input'],['name','Name','input'],['instructions','Instructions','textarea'],['workspace','Workspace override (optional)','input']]){const i=field(c,label,b[k],tag);if(k==='workspace'){const inherited=earths.find(r=>r.id===b.runner_id)?.default_workspace;i.placeholder=inherited||'Leave empty to use the Earth default'}i.onblur=async()=>{if(i.value===(b[k]||''))return;try{const x=await send('/bots/'+encodeURIComponent(b.id),'PUT',{revision:b.revision,[k]:i.value});b.revision=x.revision??b.revision;b[k]=i.value;say('Saved')}catch(e){say(e.message)}}}const rl=el('label','Earth'),rs=el('select');rs.append(new Option('No Earth selected',''));for(const r of earths)rs.append(new Option(r.name,r.id));rs.value=b.runner_id||'';rl.append(rs);c.append(rl);rs.onchange=async()=>{try{const x=await send('/bots/'+encodeURIComponent(b.id),'PUT',{revision:b.revision,runner_id:rs.value});b.revision=x.revision??b.revision;b.runner_id=rs.value;say('Saved')}catch(e){say(e.message)}};for(const [k,label] of [['shared_write','Allow shared memory writes'],['enabled','Enabled']]){const l=el('label',label),i=el('input');i.type='checkbox';i.checked=!!b[k];l.append(i);c.append(l);i.onchange=async()=>{try{const x=await send('/bots/'+encodeURIComponent(b.id),'PUT',{revision:b.revision,[k]:i.checked});b.revision=x.revision??b.revision;b[k]=i.checked;say('Saved')}catch(e){say(e.message);i.checked=!!b[k]}}}c.append(el('h4','Contacts'));const list=el('ul');c.append(list);async function loadContacts(){list.replaceChildren();const rows=await req('/bots/'+encodeURIComponent(b.id)+'/contacts');for(const q of rows){const li=el('li');li.append(el('span',`${q.target} — ${q.description||''} `));btn(li,'Remove',async()=>{await send('/bots/'+encodeURIComponent(b.id)+'/contacts','PUT',{contacts:rows.filter(x=>x.target!==q.target)});loadContacts()});list.append(li)}}await loadContacts();const target=el('select');for(const other of allBots.filter(x=>x.id!==b.id))target.append(new Option(other.name+' ('+other.alias+')',other.id));c.append(target);const description=field(c,'Contact description');btn(c,'Add contact',async()=>{if(!target.value)throw Error('Create another bot first.');const rows=await req('/bots/'+encodeURIComponent(b.id)+'/contacts');await send('/bots/'+encodeURIComponent(b.id)+'/contacts','PUT',{contacts:[...rows,{target:target.value,description:description.value}]});await loadContacts()});btn(c,'Delete bot',async()=>{if(confirm('Delete '+b.name+'? Existing task evidence is retained.')){await req('/bots/'+encodeURIComponent(b.id),{method:'DELETE'});render()}});root.append(c)}}
// Work is started by talking to a bot, so this tab reports only what needs a
// decision: work that stopped, or a stop that never confirmed.
const attentionWording={failed:'Interrupted',needs_attention:'Stopped unexpectedly',cancelling:'Stopping'};
function since(iso){if(!iso)return '';const t=Date.parse(iso.replace(' ','T')+'Z');if(isNaN(t))return '';const m=Math.round((Date.now()-t)/60000);if(m<1)return 'just now';if(m<60)return m+(m===1?' minute ago':' minutes ago');const h=Math.round(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');const d=Math.round(h/24);return d+(d===1?' day ago':' days ago')}
async function attention(){const root=panel('Needs attention'),rows=await req('/tasks?attention=1');if(!rows.length){root.append(el('p','Nothing needs attention.'));return}root.append(el('p','Work that did not finish. Acknowledging keeps it here as a reminder; dismissing removes it. Neither changes what already happened.'));for(const t of rows){const c=el('section'),state=String(t.state||'').toLowerCase(),seen=!!t.acknowledged_at;c.append(el('h3',attentionWording[state]||'Needs attention'));const meta=[t.bot_name||t.bot_id,since(t.updated_at)].filter(Boolean).join(' \u00b7 ');if(meta)c.append(el('small',meta));if(t.summary)c.append(el('p',t.summary));if(t.parent_id)c.append(el('small','Started by another bot'));if(seen)c.append(el('small','Acknowledged \u2014 kept as a reminder because changes may have been made'));const actions=el('div');if(!seen&&state!=='cancelling')btn(actions,'Acknowledge',async()=>{await send('/tasks/'+encodeURIComponent(t.id)+'/acknowledge','POST',{});attention()});if(state==='failed')btn(actions,'Retry',async()=>{if(!confirm('Retry may repeat side effects. Continue?'))return;await send('/tasks/'+encodeURIComponent(t.id)+'/retry','POST',{});attention()});btn(actions,'Dismiss',async()=>{if(!confirm('Remove this from the list? Any changes it already made will stay.'))return;await send('/tasks/'+encodeURIComponent(t.id)+'/dismiss','POST',{});attention()});c.append(actions);root.append(c)}}
async function runners(){const root=panel('Earth');root.append(el('p','Register an Earth, issue its credential, and configure it to connect outbound. Revocation disconnects control; it does not prove processes have stopped.'));const name=field(root,'Earth name');btn(root,'Register Earth',async()=>{if(!name.value.trim())throw Error('Enter an Earth name.');await send('/runners','POST',{name:name.value.trim()});runners()});for(const r of await req('/runners')){const c=el('section');c.append(el('h3',r.name),el('p',r.revoked?'Revoked':(r.status||'Disconnected')));if(r.id)c.append(el('small','Earth ID: '+r.id));c.append(el('p','Default workspace: '+(r.default_workspace||'Not configured')),el('small','Edit the default on this Earth’s local setup page.'));if(!r.revoked){btn(c,'Issue or rotate credential',async()=>{if(!confirm('Issue a new credential? Any previous credential and connection will stop working.'))return;const issued=await send('/runners/'+encodeURIComponent(r.id)+'/credential','POST',{});const display=el('section');display.append(el('p','Copy this credential into Earth configuration. It is shown only now.'));const credential=field(display,'Earth token',issued.runner_token);credential.readOnly=true;const identity=field(display,'Earth ID',r.id);identity.readOnly=true;btn(display,'Dismiss credential',()=>display.remove());c.append(display)});btn(c,'Revoke',async()=>{if(confirm('Revoke this Earth? Existing processes may still be running.')){await req('/runners/'+encodeURIComponent(r.id)+'/revoke',{method:'POST'});runners()}})};root.append(c)}}
async function memory(){const root=panel('Memory');root.append(el('p','Choose shared memory or a bot’s private memory.'));const scope=el('select');scope.append(new Option('Shared','shared'));for(const b of await req('/bots'))scope.append(new Option('Bot: '+b.name,b.id));root.append(el('label','Memory scope'),scope);const files=el('ul'),path=field(root,'Document path'),content=field(root,'Document content','','textarea');let revision='';function reset(){revision='';path.value='';content.value='';files.replaceChildren()}async function list(){files.replaceChildren();for(const x of await req('/memory?scope='+encodeURIComponent(scope.value))){const li=el('li');btn(li,x.path,async()=>{path.value=x.path;await load()});files.append(li)}}async function load(){if(!path.value.trim())throw Error('Enter a document path.');const d=await req('/memory?scope='+encodeURIComponent(scope.value)+'&path='+encodeURIComponent(path.value));content.value=d.content??'';revision=d.revision??'';say('Document loaded')}scope.onchange=()=>{reset();list().catch(e=>say(e.message))};path.onchange=()=>{revision='';content.value=''};root.append(el('h3','Files'),files);btn(root,'Load document',load);btn(root,'Save document',async()=>{if(!path.value.trim())throw Error('Enter a document path.');try{const d=await send('/memory?scope='+encodeURIComponent(scope.value),'PUT',{path:path.value,expected_revision:revision,content:content.value,operation_id:crypto.randomUUID()});revision=d.revision??revision;say('Document saved');await list()}catch(e){say(e.message+' — editor text retained')}});await list()}
async function settings(){const root=panel('Settings'),[h,s]=await Promise.all([req('/health'),req('/settings')]);root.append(el('p','Service health: '+(h.status||'Available')),el('p','Owner session: '+(authenticated?'Signed in':'Local access')),el('p','Records: '+(s.retention||'Retained')),el('p','Listening address: '+(s.bind_addr||'Not reported')));const box=el('section');box.append(el('h3','Streaming content'),el('p','These options shape streaming responses only; the client’s stream request always governs the transport.'));const checks=[['stream_heartbeat','Send waiting heartbeats while the bot works'],['stream_show_intermediate','Show intermediate turn texts (default: final answer only)']],boxes={};for(const [k,label] of checks){const l=el('label',label),i=el('input');i.type='checkbox';i.checked=!!s[k];l.append(i);box.append(l);boxes[k]=i}const activity=el('label','Progress wording (shown while the bot works; {label} is the current step)'),activityIn=el('input');activityIn.type='text';activityIn.value=s.stream_activity||'Waiting for {label}\u2026';activityIn.maxLength=200;activity.append(activityIn);box.append(activity);btn(box,'Save streaming options',async()=>{const d=await send('/settings','PUT',{stream_heartbeat:boxes.stream_heartbeat.checked,stream_show_intermediate:boxes.stream_show_intermediate.checked,stream_activity:activityIn.value});for(const k in boxes)boxes[k].checked=!!d[k];if(d.stream_activity)activityIn.value=d.stream_activity;say('Saved')});root.append(box)}async function start(){const s=await req('/auth/status');csrf=s.csrf_token||'';authenticated=!!s.authenticated;session.hidden=!authenticated;session.textContent='Log out';session.onclick=async()=>{try{await send('/auth/logout','POST',{});authenticated=false;await start()}catch(e){say(e.message)}};if(!authenticated&&s.password_required){tabs.replaceChildren();main.replaceChildren();const f=el('section');f.append(el('h2','Owner sign in'));const p=field(f,'Password');p.type='password';btn(f,'Log in',async()=>{await send('/auth/login','POST',{password:p.value});await start()});main.append(f);return}render()}start().catch(e=>say(e.message));})();</script></body></html>
